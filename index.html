
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Mon espace administrateur</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #f1f5f9;
    }

    main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 24px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    h3 {
      margin-top: 24px;
      font-size: 16px;
    }

    section {
      background: #1e293b;
      padding: 24px;
      border-radius: 14px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }

    label {
      display: block;
      margin: 16px 0 7px;
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font: inherit;
    }

    input, textarea {
      background: #0f172a;
      border: 1px solid #475569;
      color: white;
    }

    textarea {
      resize: vertical;
    }

    button {
      margin-top: 16px;
      border: 0;
      background: #38bdf8;
      color: #082f49;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary {
      background: #334155;
      color: #f1f5f9;
    }

    .status {
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.5;
    }

    .muted {
      color: #94a3b8;
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit, minmax(150px, 1fr)
      );
      gap: 12px;
      margin: 18px 0;
    }

    .stat-card {
      background: #0f172a;
      padding: 16px;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    .stat-value {
      display: block;
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }

    ul {
      padding-left: 20px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
<main>
  <h1>Mon espace administrateur</h1>

  <!-- FORMULAIRE DE DEMANDE -->
  <section>
    <h2>Envoyer une demande</h2>

    <form id="requestForm">
      <label for="name">Nom</label>
      <input
        id="name"
        name="name"
        maxlength="100"
        autocomplete="name"
        required
      >

      <label for="email">Adresse e-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        maxlength="254"
        autocomplete="email"
        required
      >

      <label for="message">Ta demande</label>
      <textarea
        id="message"
        name="message"
        maxlength="5000"
        rows="5"
        required
      ></textarea>

      <button type="submit">Envoyer la demande</button>
      <p id="requestStatus" class="status" role="status"></p>
    </form>
  </section>

  <!-- CONNEXION ADMINISTRATEUR -->
  <section>
    <h2>Administration</h2>

    <form id="adminForm">
      <label for="password">Mot de passe administrateur</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Se connecter</button>
      <p id="adminStatus" class="status" role="status"></p>
    </form>
  </section>

  <!-- TABLEAU DE BORD -->
  <section>
    <h2>Statistiques du site</h2>

    <p class="muted">
      Les statistiques sont chargées depuis le serveur.
      Connecte-toi en tant qu'administrateur pour les consulter.
    </p>

    <button id="loadStats" type="button" disabled>
      Charger les statistiques
    </button>

    <button id="logoutButton" type="button"
            class="secondary" hidden>
      Se déconnecter
    </button>

    <p id="statsStatus" class="status" role="status"></p>

    <div id="statsResults" hidden>
      <div class="stats-grid">
        <div class="stat-card">
          Visites enregistrées
          <span id="totalVisits" class="stat-value">0</span>
        </div>

        <div class="stat-card">
          Pages suivies
          <span id="pageCount" class="stat-value">0</span>
        </div>
      </div>

      <h3>Pages les plus visitées</h3>
      <ul id="popularPages"></ul>

      <h3>Visites récentes</h3>
      <ul id="recentVisits"></ul>
    </div>
  </section>
</main>

<script>
  /*
   * Pour un site local, cette adresse fonctionne si
   * le navigateur et Flask tournent sur le même PC.
   *
   * Pour un site hébergé, utilise l'URL HTTPS réelle
   * de ton serveur.
   */
  const API_URL = "http://127.0.0.1:5000";

  let adminConnected = false;

  async function apiRequest(path, options = {}) {
    const response = await fetch(`${API_URL}${path}`, {
      ...options,
      credentials: "include",
      headers: {
        ...(options.headers || {}),
        ...(options.body
          ? { "Content-Type": "application/json" }
          : {})
      }
    });

    const result = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        result.error || `Erreur HTTP ${response.status}`
      );
    }

    return result;
  }

  async function sendRequest(path, data) {
    return apiRequest(path, {
      method: "POST",
      body: JSON.stringify(data)
    });
  }

  function setAdminState(connected) {
    adminConnected = connected;

    document.getElementById("loadStats").disabled = !connected;
    document.getElementById("logoutButton").hidden = !connected;

    if (!connected) {
      document.getElementById("statsResults").hidden = true;
    }
  }

  // Envoi du formulaire
  document.getElementById("requestForm")
    .addEventListener("submit", async (event) => {
      event.preventDefault();

      const form = event.currentTarget;
      const status = document.getElementById("requestStatus");
      const button = form.querySelector('button[type="submit"]');

      button.disabled = true;
      status.textContent = "Envoi en cours...";

      try {
        const data = Object.fromEntries(new FormData(form));

        const result = await sendRequest("/api/demande", data);

        status.textContent =
          result.message || "Demande envoyée avec succès.";

        form.reset();
      } catch (error) {
        status.textContent = "Erreur : " + error.message;
      } finally {
        button.disabled = false;
      }
    });

  // Connexion administrateur
  document.getElementById("adminForm")
    .addEventListener("submit", async (event) => {
      event.preventDefault();

      const form = event.currentTarget;
      const status = document.getElementById("adminStatus");
      const button = form.querySelector('button[type="submit"]');
      const password = document.getElementById("password").value;

      button.disabled = true;
      status.textContent = "Connexion en cours...";

      try {
        const result = await sendRequest("/api/admin", {
          password
        });

        setAdminState(true);
        status.textContent =
          result.message || "Connexion réussie.";

        form.reset();
      } catch (error) {
        setAdminState(false);
        status.textContent =
          "Connexion impossible : " + error.message;
      } finally {
        button.disabled = false;
      }
    });

  // Charger les statistiques depuis l'API protégée
  document.getElementById("loadStats")
    .addEventListener("click", async () => {
      if (!adminConnected) {
        return;
      }

      const status = document.getElementById("statsStatus");
      const results = document.getElementById("statsResults");
      const button = document.getElementById("loadStats");

      button.disabled = true;
      status.textContent = "Chargement...";
      results.hidden = true;

      try {
        const data = await apiRequest("/api/analytics/summary");

        document.getElementById("totalVisits").textContent =
          data.total_visits ?? 0;

        document.getElementById("pageCount").textContent =
          (data.popular_pages || []).length;

        const pages = document.getElementById("popularPages");
        pages.replaceChildren();

        for (const item of data.popular_pages || []) {
          const li = document.createElement("li");
          li.textContent =
            `${item.page} — ${item.visits} visite(s)`;
          pages.appendChild(li);
        }

        if (!pages.children.length) {
          pages.textContent = "Aucune visite enregistrée.";
        }

        const recent = document.getElementById("recentVisits");
        recent.replaceChildren();

        for (const item of data.recent_visits || []) {
          const li = document.createElement("li");
          li.textContent = [
            item.date || "",
            item.page || "",
            item.browser || "Navigateur inconnu",
            item.os || ""
          ].filter(Boolean).join(" — ");

          recent.appendChild(li);
        }

        if (!recent.children.length) {
          recent.textContent = "Aucune visite récente.";
        }

        results.hidden = false;
        status.textContent = "Statistiques chargées.";
      } catch (error) {
        status.textContent =
          "Impossible de charger les statistiques : " +
          error.message;

        if (
          error.message.includes("401") ||
          error.message.includes("403")
        ) {
          setAdminState(false);
        }
      } finally {
        button.disabled = !adminConnected;
      }
    });

  // Déconnexion : invalider la session côté serveur.
  document.getElementById("logoutButton")
    .addEventListener("click", async () => {
      const status = document.getElementById("adminStatus");

      try {
        await apiRequest("/api/admin/logout", {
          method: "POST"
        });

        status.textContent = "Déconnexion réussie.";
      } catch (error) {
        status.textContent =
          "Erreur lors de la déconnexion : " + error.message;
      } finally {
        setAdminState(false);
      }
    });
</script>
</body>
</html>
